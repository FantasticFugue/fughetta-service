name: native-build
description: Set up the native and managed toolchains, then configure and build a CMake preset.

inputs:
  preset:
    description: CMake configure and build preset
    required: true
  configure-args:
    description: Additional CMake configure arguments
    default: ''
  targets:
    description: Space-separated CMake targets, or empty to build the default targets
    default: ''
  llvm-version:
    description: LLVM release (Linux takes its major from apt.llvm.org)
    default: 23.1.5
  cmake-version:
    description: CMake release
    default: 4.5.0

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    # The CLR providers build with the newest SDK and target net10.0, whose
    # reference pack the 10.0 SDK installs.
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'

    - uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: current

    # PyPI lags the CMake release, so CMake comes from Kitware's release.
    - name: Install build tools
      shell: bash
      env:
        CMAKE_VERSION: ${{ inputs.cmake-version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade ninja
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) package=linux-x86_64.tar.gz bin=bin ;;
          Linux-ARM64) package=linux-aarch64.tar.gz bin=bin ;;
          macOS-*) package=macos-universal.tar.gz bin=CMake.app/Contents/bin ;;
          Windows-X64) package=windows-x86_64.zip bin=bin ;;
          Windows-ARM64) package=windows-arm64.zip bin=bin ;;
        esac
        archive="$RUNNER_TEMP/cmake-$CMAKE_VERSION-$package"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-$package"
        case "$package" in
          *.zip) 7z x -y -o"$RUNNER_TEMP" "$archive" >/dev/null ;;
          *) tar -xzf "$archive" -C "$RUNNER_TEMP" ;;
        esac
        root="$RUNNER_TEMP/cmake-$CMAKE_VERSION-${package%%.*}/$bin"
        if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -w "$root")"; fi
        echo "$root" >> "$GITHUB_PATH"
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y autoconf autoconf-archive automake libtool ;;
          macOS) brew install autoconf autoconf-archive automake libtool ;;
        esac

    # Linux takes clang from apt.llvm.org and macOS from the LLVM release; both
    # ship libc++ with its modules manifest. Windows takes clang-cl from the
    # LLVM release and compiles against the MSVC STL and Windows SDK of the
    # runner's Visual Studio. The release trees also carry LLVM's libraries.
    - name: Fetch clang
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        set -euo pipefail
        temporary="$RUNNER_TEMP"
        case "$RUNNER_OS" in
          Linux)
            major="${LLVM_VERSION%%.*}"
            . /etc/os-release
            curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key |
              sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$major main" |
              sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
            sudo apt-get install -y "clang-$major" "clang-tools-$major" "llvm-$major" "llvm-$major-dev" \
              "libc++-$major-dev" "libc++abi-$major-dev" "libclang-rt-$major-dev"
            root="/usr/lib/llvm-$major"
            id="apt-$("$root/bin/clang" -dumpversion)" ;;
          macOS)
            case "$RUNNER_ARCH" in ARM64) arch=ARM64 ;; esac
            name="LLVM-$LLVM_VERSION-macOS-$arch"
            curl -fsSL --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz" -o "$temporary/$name.tar.xz"
            tar -xf "$temporary/$name.tar.xz" -C "$temporary"
            root="$temporary/$name"
            # Autotools invokes upstream clang directly, so it needs the SDK
            # in the environment as well as CMake's compiler configuration.
            echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
            # The SDK's libc++ lacks symbols used by the upstream headers.
            runtime=$(find "$root/lib" -name libc++.dylib | sed -n '1p')
            if [[ -z "$runtime" ]]; then
              echo "LLVM $LLVM_VERSION did not include its libc++ runtime" >&2
              exit 1
            fi
            runtime_dir=$(dirname "$runtime")
            echo "LDFLAGS=${LDFLAGS:+$LDFLAGS }-L\"$runtime_dir\" -Wl,-rpath,\"$runtime_dir\"" >> "$GITHUB_ENV"
            id="llvm-$LLVM_VERSION-sdk-$(xcrun --sdk macosx --show-sdk-version)" ;;
          Windows)
            case "$RUNNER_ARCH" in X64) arch=x86_64 ;; ARM64) arch=aarch64 ;; esac
            name="clang+llvm-$LLVM_VERSION-$arch-pc-windows-msvc"
            temporary="$(cygpath -u "$temporary")"
            curl -fsSL --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz" -o "$temporary/$name.tar.xz"
            tar -xf "$temporary/$name.tar.xz" -C "$temporary"
            root="$(cygpath -m "$temporary/$name")"
            id="llvm-$LLVM_VERSION" ;;
        esac
        echo "CLANG_ROOT=$root" >> "$GITHUB_ENV"
        echo "CLANG_ID=$id" >> "$GITHUB_ENV"

    # Port versions can refer to Git trees from earlier commits, so the
    # registry needs the history reachable from the manifest's baseline.
    - name: Install vcpkg
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/vcpkg"
        if [ "$RUNNER_OS" = Windows ]; then
          root="$(cygpath -m "$root")"
        fi
        baseline="$(python -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")"
        git init -q "$root"
        git -C "$root" fetch -q --no-tags https://github.com/microsoft/vcpkg.git "$baseline"
        git -C "$root" checkout -q FETCH_HEAD
        if [ "$RUNNER_OS" = Windows ]; then
          cmd //c "$(cygpath -w "$root/bootstrap-vcpkg.bat")" -disableMetrics
        else
          "$root/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

    - name: Cache vcpkg downloads
      uses: actions/cache@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg-downloads
        key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-downloads-${{ runner.os }}-

    - name: Restore installed vcpkg dependencies
      id: installed
      uses: actions/cache/restore@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg_installed
        key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ env.CLANG_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/toolchain.cmake') }}
        restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ env.CLANG_ID }}-

    - name: Configure
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        CONFIGURE_ARGS: ${{ inputs.configure-args }}
      run: |
        read -r -a arguments <<< "$CONFIGURE_ARGS"
        cmake --preset "$PRESET" "${arguments[@]}"

    # After configure, the dependency cache is usable even if compilation fails.
    - name: Cache installed vcpkg dependencies
      if: steps.installed.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg_installed
        key: ${{ steps.installed.outputs.cache-primary-key }}

    - name: Build
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        BUILD_TARGETS: ${{ inputs.targets }}
      run: |
        read -r -a targets <<< "$BUILD_TARGETS"
        arguments=()
        if ((${#targets[@]})); then
          arguments=(--target "${targets[@]}")
        fi
        build_log="$RUNNER_TEMP/native-build-$PRESET.log"
        for attempt in 1 2 3; do
          if cmake --build --preset "$PRESET" --parallel 2 "${arguments[@]}" 2>&1 | tee "$build_log"; then
            exit 0
          else
            status=$?
          fi
          if [[ "$attempt" == 3 ]] || ! grep -Fq 'PLEASE submit a bug report to https://github.com/llvm/llvm-project/issues/' "$build_log"; then
            exit "$status"
          fi
          echo "Clang crashed; resuming the Ninja build."
        done
