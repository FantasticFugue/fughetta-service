name: build

# Debug builds and tests on Linux x64 and Windows x64, with sanitizers on Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  XCLANG_VERSION: 23.1.3.6

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fughetta-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            xclang_triple: x86_64-unknown-linux-gnu
            sanitizers: address,undefined
          - name: windows-x64
            os: windows-2025
            xclang_triple: x86_64-w64-mingw32
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          path: fughetta-service

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install build tools
        shell: bash
        run: python -m pip install --upgrade 'cmake>=4.0' ninja

      - name: Install Linux dependency build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          name="xclang-$XCLANG_VERSION-${{ matrix.xclang_triple }}.tar.xz"
          temporary="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            temporary="$(cygpath -u "$temporary")"
          fi
          curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
          tar -xf "$temporary/$name" -C "$temporary"
          root="$temporary/xclang"
          if [ "$RUNNER_OS" = Windows ]; then
            root="$(cygpath -m "$root")"
          fi
          echo "XCLANG_ROOT=$root" >> "$GITHUB_ENV"

      # The builtin baseline in vcpkg-configuration.json must be in the clone's
      # history, so the clone is not shallow.
      - name: Install vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$VCPKG_ROOT/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg downloads
        uses: actions/cache@v6
        with:
          path: fughetta-service/build/debug/vcpkg-downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore installed vcpkg dependencies
        id: vcpkg-installed
        uses: actions/cache/restore@v6
        with:
          path: fughetta-service/build/debug/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-debug-${{ env.XCLANG_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-debug-${{ env.XCLANG_VERSION }}-

      - name: Configure
        shell: bash
        run: >-
          cmake -B build/debug -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS_DEBUG=-g0
          -DXCLANG_SANITIZER=${{ matrix.sanitizers }}

      - name: Cache installed vcpkg dependencies
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: fughetta-service/build/debug/vcpkg_installed
          key: ${{ steps.vcpkg-installed.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        # xclang 23.1.3.6 occasionally segfaults on a unit that compiles on the
        # next attempt; ninja retries only what failed, and ten failures fail the step.
        run: |
          for attempt in $(seq 10); do
            cmake --build build/debug --parallel 2 && exit 0
          done
          exit 1

      - name: Test
        shell: bash
        run: ctest --test-dir build/debug --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            fughetta-service/build/debug/vcpkg-manifest-install.log
            fughetta-service/build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
