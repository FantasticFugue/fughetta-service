name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCLANG_VERSION: 23.1.3.6
  VCPKG_REGISTRY_URL: https://github.com/FantasticFugue/vcpkg-registry
  VCPKG_REGISTRY_REF: tls-msquic-openssl
  HTTPANT_GIT_URL: https://github.com/tsurumi-yizhou/httpant
  HTTPANT_GIT_REF: tls-quic-native-io

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fughetta-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            xclang_triple: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            xclang_triple: aarch64-apple-darwin
          - name: windows-x64
            os: windows-2025
            xclang_triple: x86_64-w64-mingw32
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v5
        with:
          path: fughetta-service

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tools
        shell: bash
        run: python -m pip install --upgrade 'cmake>=4.0' ninja

      - name: Install Linux dependency build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install macOS dependency build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install autoconf autoconf-archive automake libtool

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          name="xclang-$XCLANG_VERSION-${{ matrix.xclang_triple }}.tar.xz"
          temporary="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            temporary="$(cygpath -u "$temporary")"
          fi
          curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
          tar -xf "$temporary/$name" -C "$temporary"
          root="$temporary/xclang"
          if [ "$RUNNER_OS" = Windows ]; then
            root="$(cygpath -m "$root")"
          fi
          echo "XCLANG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Install vcpkg (latest)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$VCPKG_ROOT/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: fughetta-service/build/debug/vcpkg-downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch current dependency sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$VCPKG_REGISTRY_REF" "$VCPKG_REGISTRY_URL" ../vcpkg-registry
          git clone --depth 1 --branch "$HTTPANT_GIT_REF" "$HTTPANT_GIT_URL" ../httpant

      - name: Restore installed vcpkg dependencies
        id: vcpkg-installed
        uses: actions/cache/restore@v4
        with:
          path: fughetta-service/build/debug/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-debug-${{ env.XCLANG_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-debug-${{ env.XCLANG_VERSION }}-

      - name: Configure
        shell: bash
        run: cmake -B build/debug -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DSANITIZERS=address,undefined

      - name: Cache installed vcpkg dependencies
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: fughetta-service/build/debug/vcpkg_installed
          key: ${{ steps.vcpkg-installed.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: cmake --build build/debug --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build/debug --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            fughetta-service/build/debug/vcpkg-manifest-install.log
            fughetta-service/build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
