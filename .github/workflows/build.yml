name: build

# Native debug builds and tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
            configure: -DCLANG_SANITIZER=
            targets: executor-test
            test: -R '^executor$'
          - name: windows-x64
            os: windows-2025
            configure: -DCLANG_SANITIZER=
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/native-build
        with:
          preset: debug
          configure-args: ${{ matrix.configure }}
          targets: ${{ matrix.targets }}

      - name: Test
        run: ctest --preset debug ${{ matrix.test }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/debug/vcpkg-manifest-install.log
            build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Retain macOS test results
        if: matrix.name == 'macos-arm64' && success()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.name }}
          path: build/debug/Testing/Temporary/LastTest.log
