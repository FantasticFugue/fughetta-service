name: build

# The debug preset on Linux x64 and Windows x64, with sanitizers on Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2025
            configure: -DXCLANG_SANITIZER=
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          preset: debug

      - name: Configure
        run: cmake --preset debug ${{ matrix.configure }}

      - name: Cache installed vcpkg dependencies
        if: steps.toolchain.outputs.installed-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/debug/vcpkg_installed
          key: ${{ steps.toolchain.outputs.installed-key }}

      - name: Build
        # xclang occasionally segfaults on a unit that compiles on the next
        # attempt; ninja retries only what failed, and ten failures fail the step.
        run: |
          for attempt in $(seq 10); do
            cmake --build --preset debug --parallel 2 && exit 0
          done
          exit 1

      - name: Test
        run: ctest --preset debug

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/debug/vcpkg-manifest-install.log
            build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
