name: build-linux

on:
  push:
    branches: [main, ci/native-build-20261120]
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Load build settings
        id: settings
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from xml.etree import ElementTree
          config = json.loads(Path(".github/ci.json").read_text())
          minimum = json.loads(Path("CMakePresets.json").read_text())["cmakeMinimumRequired"]
          config["toolchain"]["cmake"] = ".".join(str(minimum[p]) for p in ("major", "minor", "patch"))
          clr = ElementTree.parse("providers/clr/Directory.Build.props")
          framework = clr.findtext(".//TargetFramework").removeprefix("net")
          sdk = clr.findtext(".//FughettaMinimumSdkVersion")
          config["toolchain"]["dotnet"] = "\n".join(f"{v}.x" for v in dict.fromkeys((framework, sdk)))
          jvm = dict(line.split("=", 1) for line in Path("providers/jvm/gradle.properties").read_text().splitlines()
                     if "=" in line and not line.lstrip().startswith(("#", "!")))
          config["toolchain"]["java"]["version"] = jvm["fughetta.javaVersion"]
          runner = next(r for r in config["runners"] if r["id"] == os.environ["PLATFORM"])
          profiles = config["profiles"]
          check = runner.get("check") or {}
          package = runner.get("package") or {}
          out = {
              "settings": json.dumps(config, separators=(",", ":")),
              "check_preset": profiles["check"]["preset"],
              "check_configure": check.get("configure", ""),
              "check_targets": profiles["check"].get("targets", ""),
              "check_pattern": check.get("test_pattern", ""),
              "retain_test_log": "true" if check.get("retain_test_log") else "false",
              "package_preset": profiles["package"]["preset"],
              "package_configure": package.get("configure", ""),
              "package_targets": package.get("targets", profiles["package"].get("targets", "")),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, value in out.items():
                  f.write(f"{key}={value}\n")
          PY

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ fromJSON(steps.settings.outputs.settings).toolchain.dotnet }}
      - uses: actions/setup-java@v5
        id: java
        with:
          distribution: ${{ fromJSON(steps.settings.outputs.settings).toolchain.java.distribution }}
          java-version: ${{ fromJSON(steps.settings.outputs.settings).toolchain.java.version }}
      - uses: gradle/actions/setup-gradle@v5
        id: gradle
        with:
          gradle-version: ${{ fromJSON(steps.settings.outputs.settings).toolchain.gradle }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set paths
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/fughetta-ci"
          mkdir -p "$cache/vcpkg/downloads" "$cache/vcpkg/archives"
          {
            echo "DEBUG_DIR=$RUNNER_TEMP/fughetta-build-debug"
            echo "RELEASE_DIR=$RUNNER_TEMP/fughetta-build-release"
            echo "PACKAGE_DIR=$RUNNER_TEMP/fughetta-build-release/packages"
            echo "CI_IMAGE_VERSION=${ImageVersion:-$RUNNER_OS}"
            echo "CI_TOOLCHAIN_CACHE=$cache/toolchain"
            echo "CI_VCPKG_CACHE=$cache/vcpkg"
            echo "VCPKG_DOWNLOADS=$cache/vcpkg/downloads"
            echo "VCPKG_BINARY_SOURCES=clear;files,$cache/vcpkg/archives,readwrite"
            echo "NUGET_PACKAGES=$cache/nuget"
            echo "GRADLE_USER_HOME=$cache/gradle"
          } >> "$GITHUB_ENV"

      - name: Restore toolchain downloads
        id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CI_TOOLCHAIN_CACHE }}
          key: native-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(steps.settings.outputs.settings).toolchain.cmake }}-${{ fromJSON(steps.settings.outputs.settings).toolchain.llvm }}

      - name: Install build tools
        env:
          CMAKE_VERSION: ${{ fromJSON(steps.settings.outputs.settings).toolchain.cmake }}
          FETCH_RETRIES: ${{ fromJSON(steps.settings.outputs.settings).download_retries }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade ninja
          archive="$CI_TOOLCHAIN_CACHE/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz"
          mkdir -p "$(dirname "$archive")"
          if [[ ! -f "$archive" ]]; then
            curl -fsSL --retry "$FETCH_RETRIES" -o "$archive" \
              "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz"
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-$CMAKE_VERSION-linux-x86_64/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Fetch clang
        env:
          LLVM_VERSION: ${{ fromJSON(steps.settings.outputs.settings).toolchain.llvm }}
          FETCH_RETRIES: ${{ fromJSON(steps.settings.outputs.settings).download_retries }}
        run: |
          set -euo pipefail
          major="${LLVM_VERSION%%.*}"
          . /etc/os-release
          curl -fsSL --retry "$FETCH_RETRIES" https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$major main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "clang-$major" "clang-tools-$major" "lld-$major" "llvm-$major" "llvm-$major-dev" \
            "libc++-$major-dev" "libc++abi-$major-dev" "libclang-rt-$major-dev"
          driver=$(readlink -f "$(command -v "clang-$major")")
          root=$(dirname "$(dirname "$driver")")
          echo "CLANG_ROOT=$root" >> "$GITHUB_ENV"
          echo "CLANG_ID=apt-$("$root/bin/clang" -dumpversion)" >> "$GITHUB_ENV"

      - name: Save toolchain downloads
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CI_TOOLCHAIN_CACHE }}
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Restore vcpkg downloads and binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CI_VCPKG_CACHE }}
          key: vcpkg-packages-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_ID }}-${{ env.CI_IMAGE_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/toolchain.cmake') }}
          restore-keys: vcpkg-packages-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_ID }}-

      - name: Install vcpkg
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vcpkg"
          baseline="$(python -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")"
          git init -q "$root"
          git -C "$root" fetch -q --no-tags https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$root" checkout -q FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Identify build caches
        id: keys
        env:
          CMAKE_VERSION: ${{ fromJSON(steps.settings.outputs.settings).toolchain.cmake }}
          JAVA_VERSION: ${{ steps.java.outputs.version }}
          GRADLE_VERSION: ${{ steps.gradle.outputs.gradle-version }}
        run: |
          set -euo pipefail
          config=$(git log -1 --format=%H -- CMakePresets.json cmake/toolchain.cmake vcpkg.json vcpkg-configuration.json)
          common="$RUNNER_OS-$RUNNER_ARCH-$CI_IMAGE_VERSION-$CMAKE_VERSION-$CLANG_ID-$JAVA_VERSION-$GRADLE_VERSION-$(dotnet --version)-$config-"
          paths_for() {
            for path in .ninja_deps .ninja_log build.ninja CMakeCache.txt CMakeFiles '*.cmake' \
                '*.a' '*.exe' '*.lib' '*.pdb' '*-test' fughetta-service _deps clr jvm llvm tests \
                vcpkg_installed vcpkg-triplets source-times.json; do
              printf '%s/%s\n' "$1" "$path"
            done
          }
          {
            echo "debug_prefix=native-build-debug-$common"
            echo "release_prefix=native-build-release-$common"
            echo "debug_paths<<NATIVE_DEBUG_PATHS"
            paths_for "$DEBUG_DIR"
            echo NATIVE_DEBUG_PATHS
            echo "release_paths<<NATIVE_RELEASE_PATHS"
            paths_for "$RELEASE_DIR"
            echo NATIVE_RELEASE_PATHS
          } >> "$GITHUB_OUTPUT"

      - name: Restore debug build cache
        id: debug-cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.debug_prefix }}${{ github.sha }}
          restore-keys: ${{ steps.keys.outputs.debug_prefix }}
          path: ${{ steps.keys.outputs.debug_paths }}

      - name: Restore debug source timestamps
        if: steps.debug-cache.outputs.cache-matched-key != ''
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.DEBUG_DIR }}
          mode: restore

      - name: Configure (check)
        env:
          CONFIGURE_ARGS: ${{ steps.settings.outputs.check_configure }}
        run: |
          set -euo pipefail
          read -r -a arguments <<< "$CONFIGURE_ARGS"
          cmake --preset "${{ steps.settings.outputs.check_preset }}" -B "$DEBUG_DIR" "${arguments[@]}" \
            -DFUGHETTA_GRADLE_USER_HOME="$GRADLE_USER_HOME"

      - name: Save vcpkg downloads and binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CI_VCPKG_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Restore NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('providers/clr/**/*.fsproj', 'providers/clr/**/*.csproj', 'providers/clr/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build service (check)
        env:
          BUILD_JOBS: ${{ fromJSON(steps.settings.outputs.settings).compile_jobs }}
          BUILD_ATTEMPTS: ${{ fromJSON(steps.settings.outputs.settings).build_attempts }}
          RATE_LIMIT_WAIT: ${{ fromJSON(steps.settings.outputs.settings).rate_limit_wait_seconds }}
        uses: ./.github/actions/build-stage
        with:
          directory: ${{ env.DEBUG_DIR }}
          stage: check-service
          targets: fughetta-service

      - name: Store check build cache through service
        if: steps.debug-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.DEBUG_DIR }}
          mode: save
          prefix: ${{ steps.keys.outputs.debug_prefix }}
      - uses: actions/cache/save@v6
        if: steps.debug-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.debug-cache.outputs.cache-primary-key }}
          path: ${{ steps.keys.outputs.debug_paths }}

      - name: Build providers (check)
        env:
          BUILD_JOBS: ${{ fromJSON(steps.settings.outputs.settings).compile_jobs }}
          BUILD_ATTEMPTS: ${{ fromJSON(steps.settings.outputs.settings).build_attempts }}
          RATE_LIMIT_WAIT: ${{ fromJSON(steps.settings.outputs.settings).rate_limit_wait_seconds }}
        uses: ./.github/actions/build-stage
        with:
          directory: ${{ env.DEBUG_DIR }}
          stage: check-providers
          targets: llvm-provider clr-providers jvm-providers

      - name: Store check build cache through providers
        if: steps.debug-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.DEBUG_DIR }}
          mode: save
          prefix: ${{ steps.keys.outputs.debug_prefix }}
      - uses: actions/cache/save@v6
        if: steps.debug-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.debug-cache.outputs.cache-primary-key }}
          path: ${{ steps.keys.outputs.debug_paths }}

      - name: Build tests (check)
        env:
          BUILD_JOBS: ${{ fromJSON(steps.settings.outputs.settings).compile_jobs }}
          BUILD_ATTEMPTS: ${{ fromJSON(steps.settings.outputs.settings).build_attempts }}
          RATE_LIMIT_WAIT: ${{ fromJSON(steps.settings.outputs.settings).rate_limit_wait_seconds }}
        uses: ./.github/actions/build-stage
        with:
          directory: ${{ env.DEBUG_DIR }}
          stage: check-tests
          targets: all

      - name: Store check build cache through tests
        if: steps.debug-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.DEBUG_DIR }}
          mode: save
          prefix: ${{ steps.keys.outputs.debug_prefix }}
      - uses: actions/cache/save@v6
        if: steps.debug-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.debug-cache.outputs.cache-primary-key }}
          path: ${{ steps.keys.outputs.debug_paths }}

      - name: Save NuGet packages
        if: ${{ !cancelled() && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Test
        env:
          BUILD_DIR: ${{ env.DEBUG_DIR }}
          PRESET: ${{ steps.settings.outputs.check_preset }}
          TEST_PATTERN: ${{ steps.settings.outputs.check_pattern }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ -n "$TEST_PATTERN" ]]; then arguments=(-R "$TEST_PATTERN"); fi
          ctest --preset "$PRESET" --test-dir "$BUILD_DIR" "${arguments[@]}"

      - name: Restore release build cache
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.keys.outputs.release_prefix }}${{ github.sha }}
          restore-keys: ${{ steps.keys.outputs.release_prefix }}
          path: ${{ steps.keys.outputs.release_paths }}

      - name: Restore release source timestamps
        if: steps.release-cache.outputs.cache-matched-key != ''
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.RELEASE_DIR }}
          mode: restore

      - name: Configure (package)
        env:
          CONFIGURE_ARGS: ${{ steps.settings.outputs.package_configure }}
        run: |
          set -euo pipefail
          read -r -a arguments <<< "$CONFIGURE_ARGS"
          cmake --preset "${{ steps.settings.outputs.package_preset }}" -B "$RELEASE_DIR" "${arguments[@]}" \
            -DFUGHETTA_GRADLE_USER_HOME="$GRADLE_USER_HOME"

      - name: Build service (package)
        env:
          BUILD_JOBS: ${{ fromJSON(steps.settings.outputs.settings).compile_jobs }}
          BUILD_ATTEMPTS: ${{ fromJSON(steps.settings.outputs.settings).build_attempts }}
          RATE_LIMIT_WAIT: ${{ fromJSON(steps.settings.outputs.settings).rate_limit_wait_seconds }}
        uses: ./.github/actions/build-stage
        with:
          directory: ${{ env.RELEASE_DIR }}
          stage: package-service
          targets: fughetta-service

      - name: Store package build cache through service
        if: steps.release-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.RELEASE_DIR }}
          mode: save
          prefix: ${{ steps.keys.outputs.release_prefix }}
      - uses: actions/cache/save@v6
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
          path: ${{ steps.keys.outputs.release_paths }}

      - name: Build providers (package)
        env:
          BUILD_JOBS: ${{ fromJSON(steps.settings.outputs.settings).compile_jobs }}
          BUILD_ATTEMPTS: ${{ fromJSON(steps.settings.outputs.settings).build_attempts }}
          RATE_LIMIT_WAIT: ${{ fromJSON(steps.settings.outputs.settings).rate_limit_wait_seconds }}
        uses: ./.github/actions/build-stage
        with:
          directory: ${{ env.RELEASE_DIR }}
          stage: package-providers
          targets: llvm-provider clr-providers jvm-providers

      - name: Store package build cache through providers
        if: steps.release-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/build-cache
        with:
          directory: ${{ env.RELEASE_DIR }}
          mode: save
          prefix: ${{ steps.keys.outputs.release_prefix }}
      - uses: actions/cache/save@v6
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
          path: ${{ steps.keys.outputs.release_paths }}

      - name: Install packaging tools
        run: sudo apt-get install -y patchelf

      - name: Package
        env:
          BUILD_DIR: ${{ env.RELEASE_DIR }}
          PACKAGE_OUTPUT: ${{ env.PACKAGE_DIR }}
        run: |
          python cmake/packaging/package.py --build "$BUILD_DIR" --output "$PACKAGE_OUTPUT" \
            --build-number "$GITHUB_RUN_NUMBER" --worker-assets

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
