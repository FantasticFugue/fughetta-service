name: nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            asset: fughetta-service-linux-x64
          - name: macos-arm64
            os: macos-15
            asset: fughetta-service-darwin-arm64
          - name: windows-x64
            os: windows-2025
            asset: fughetta-service-win32-x64.exe
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          preset: release

      - name: Configure
        run: cmake --preset release

      - name: Cache installed vcpkg dependencies
        if: steps.toolchain.outputs.installed-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/release/vcpkg_installed
          key: ${{ steps.toolchain.outputs.installed-key }}

      - name: Build
        # xclang occasionally segfaults on a unit that compiles on the next
        # attempt; ninja retries only what failed, and ten failures fail the step.
        run: |
          for attempt in $(seq 10); do
            cmake --build --preset release --target fughetta-service --parallel 2 && exit 0
          done
          exit 1

      - name: Package
        run: |
          set -euo pipefail
          cmake --install build/release --prefix dist-root
          binary="$(ls dist-root/bin/fughetta-service*)"
          if [ "$RUNNER_OS" != Windows ]; then
            "$XCLANG_ROOT/bin/llvm-strip" "$binary"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --force --sign - "$binary"
          fi
          mkdir -p dist
          cp "$binary" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-nightly-${{ matrix.name }}
          path: build/release/vcpkg-manifest-install.log
          if-no-files-found: ignore

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true

      - name: Publish nightly as the latest release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Nightly build from main at $GITHUB_SHA.

          Includes Linux x64, Windows x64, and macOS arm64 binaries.
          Run \`fug worker\` to download the binary for your machine automatically.

          This nightly is published as Latest so fughetta-cli's default
          releases/latest endpoint can find it. It is a development build.
          Each build has its own tag so the CLI downloads it into a new cache directory.
          EOF
          gh release create "$RELEASE_TAG" dist/* --draft \
            --target "$GITHUB_SHA" --title "Nightly $RELEASE_TAG" --notes-file notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
