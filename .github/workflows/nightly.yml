name: nightly

on:
  push:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      wix-eula-id:
        description: WiX EULA accepted by the organization for this run
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/native.yml
    with:
      profile: package
      wix-eula-id: ${{ inputs.wix-eula-id || vars.FUGHETTA_WIX_EULA_ID }}

  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: package
    runs-on: ${{ vars.FUGHETTA_COORDINATOR_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
    steps:
      - id: download
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.package.outputs.artifact-pattern }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Publish nightly as the latest release
        shell: bash
        env:
          RELEASE_ASSETS: ${{ steps.download.outputs.download-path }}
        run: |
          set -euo pipefail
          printf 'Nightly build from %s at %s.\n\nIncludes the native service installers and the binaries fetched by `fug worker`.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" "$RELEASE_ASSETS"/* --draft \
            --target "$GITHUB_SHA" --title "Nightly $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
