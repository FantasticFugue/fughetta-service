name: nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCLANG_VERSION: 23.1.3.6

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        working-directory: fughetta-service
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            xclang_triple: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            asset: fughetta-service-linux-x64
            binary: fughetta-service
          - name: macos-arm64
            os: macos-15
            xclang_triple: aarch64-apple-darwin
            target: aarch64-apple-darwin
            asset: fughetta-service-darwin-arm64
            binary: fughetta-service
          - name: windows-x64
            os: windows-2025
            xclang_triple: x86_64-w64-mingw32
            target: x86_64-pc-windows-msvc
            asset: fughetta-service-win32-x64.exe
            binary: fughetta-service.exe
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          path: fughetta-service

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade 'cmake>=4.0' ninja

      - name: Install Linux dependency build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install macOS dependency build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install autoconf autoconf-archive automake libtool

      - name: Fetch xclang
        run: |
          set -euo pipefail
          name="xclang-$XCLANG_VERSION-${{ matrix.xclang_triple }}.tar.xz"
          temporary="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            temporary="$(cygpath -u "$temporary")"
          fi
          curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
          tar -xf "$temporary/$name" -C "$temporary"
          root="$temporary/xclang"
          if [ "$RUNNER_OS" = Windows ]; then
            root="$(cygpath -m "$root")"
          fi
          echo "XCLANG_ROOT=$root" >> "$GITHUB_ENV"

      # The builtin baseline in vcpkg-configuration.json must be in the clone's
      # history, so the clone is not shallow.
      - name: Install vcpkg
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$VCPKG_ROOT/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg downloads
        uses: actions/cache@v6
        with:
          path: fughetta-service/build/release/vcpkg-downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore installed vcpkg dependencies
        id: vcpkg-installed
        uses: actions/cache/restore@v6
        with:
          path: fughetta-service/build/release/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-release-${{ env.XCLANG_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-release-${{ env.XCLANG_VERSION }}-

      - name: Configure
        run: >-
          cmake -B build/release -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake
          -DXCLANG_TARGET=${{ matrix.target }}
          -DCMAKE_BUILD_TYPE=Release
          -DFUGHETTA_BUILD_TESTS=OFF
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Cache installed vcpkg dependencies
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: fughetta-service/build/release/vcpkg_installed
          key: ${{ steps.vcpkg-installed.outputs.cache-primary-key }}

      - name: Build
        # xclang 23.1.3.6 occasionally segfaults on a unit that compiles on the
        # next attempt; ninja retries only what failed, and ten failures fail the step.
        run: |
          for attempt in $(seq 10); do
            cmake --build build/release --target fughetta-service --parallel 2 && exit 0
          done
          exit 1

      - name: Package
        run: |
          set -euo pipefail
          binary="build/release/${{ matrix.binary }}"
          if [ "$RUNNER_OS" != Windows ]; then
            "$XCLANG_ROOT/bin/llvm-strip" "$binary"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --force --sign - "$binary"
          fi
          mkdir -p dist
          cp "$binary" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.name }}
          path: fughetta-service/dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-nightly-${{ matrix.name }}
          path: fughetta-service/build/release/vcpkg-manifest-install.log
          if-no-files-found: ignore

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true

      - name: Publish nightly as the latest release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Nightly build from main at $GITHUB_SHA.

          Includes Linux x64, Windows x64, and macOS arm64 binaries.
          Run \`fug worker\` to download the binary for your machine automatically.

          This nightly is published as Latest so fughetta-cli's default
          releases/latest endpoint can find it. It is a development build.
          Each build has its own tag so the CLI downloads it into a new cache directory.
          EOF
          gh release create "$RELEASE_TAG" dist/* --draft \
            --target "$GITHUB_SHA" --title "Nightly $RELEASE_TAG" --notes-file notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
