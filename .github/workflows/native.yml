name: native

on:
  workflow_call:
    inputs:
      profile:
        description: Native build profile to run
        type: string
        required: true
      wix-eula-id:
        description: WiX EULA accepted by the organization for this run
        type: string
    outputs:
      release-tag:
        value: ${{ jobs.plan.outputs.release-tag }}
      artifact-pattern:
        value: ${{ jobs.plan.outputs.artifact-pattern }}

jobs:
  plan:
    runs-on: ${{ vars.FUGHETTA_COORDINATOR_RUNNER || 'ubuntu-latest' }}
    outputs:
      settings: ${{ steps.config.outputs.settings }}
      release-tag: ${{ steps.config.outputs.release-tag }}
      release-url: ${{ steps.config.outputs.release-url }}
      artifact-pattern: ${{ steps.config.outputs.artifact-pattern }}
    steps:
      - uses: actions/checkout@v7
      - id: config
        name: Load build settings
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          clr=$(yq -p=xml -o=json '.Project.PropertyGroup' providers/clr/Directory.Build.props)
          java=$(yq -e -p=props -oy '.fughetta.javaVersion' providers/jvm/gradle.properties)
          settings=$(jq -ce --slurpfile presets CMakePresets.json --argjson clr "$clr" --arg java "$java" '
            ($clr | add) as $properties |
            ($properties.TargetFramework | ltrimstr("net")) as $framework |
            $properties.FughettaMinimumSdkVersion as $sdk |
            .toolchain.cmake = ($presets[0].cmakeMinimumRequired | [.major, .minor, .patch] | join(".")) |
            .toolchain.dotnet = ([$framework, ($sdk | select(. != $framework))] | map(. + ".x") | join("\n")) |
            .toolchain.java.version = $java
          ' .github/ci.json)
          tag="$GITHUB_WORKFLOW-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "settings=$settings"
            echo "release-tag=$tag"
            echo "release-url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
            echo "artifact-pattern=$PROFILE-*"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.settings).profiles[inputs.profile].timeout }}
    defaults:
      run:
        shell: bash
    env:
      PRESET: ${{ fromJSON(needs.plan.outputs.settings).profiles[inputs.profile].preset }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.settings).runners }}
    steps:
      - uses: actions/checkout@v7

      - id: native
        uses: ./.github/actions/native-build
        with:
          settings: ${{ needs.plan.outputs.settings }}
          preset: ${{ env.PRESET }}
          configure-args: ${{ matrix[inputs.profile].configure }}
          targets: ${{ matrix[inputs.profile].targets || fromJSON(needs.plan.outputs.settings).profiles[inputs.profile].targets }}

      - name: Test
        if: inputs.profile == 'check'
        env:
          BUILD_DIR: ${{ steps.native.outputs.build-directory }}
          TEST_PATTERN: ${{ matrix.check.test_pattern }}
        run: |
          arguments=()
          if [[ -n "$TEST_PATTERN" ]]; then arguments=(-R "$TEST_PATTERN"); fi
          ctest --preset "$PRESET" --test-dir "$BUILD_DIR" "${arguments[@]}"

      - name: Install packaging tools
        if: inputs.profile == 'package'
        env:
          WIX_EULA_ID: ${{ inputs.wix-eula-id }}
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y patchelf ;;
            Windows)
              tools=$(cygpath -m "$RUNNER_TEMP/wix")
              dotnet tool install wix --tool-path "$tools"
              echo "$tools" >> "$GITHUB_PATH"
              if [[ -n "$WIX_EULA_ID" ]]; then "$tools/wix" eula accept "$WIX_EULA_ID"; fi
              "$tools/wix" extension add WixToolset.Util.wixext ;;
          esac

      - name: Package native service and worker binaries
        if: inputs.profile == 'package'
        env:
          BUILD_DIR: ${{ steps.native.outputs.build-directory }}
          PACKAGE_OUTPUT: ${{ steps.native.outputs.package-directory }}
          RELEASE_URL: ${{ needs.plan.outputs.release-url }}
        run: |
          python cmake/packaging/package.py --build "$BUILD_DIR" --output "$PACKAGE_OUTPUT" \
            --build-number "$GITHUB_RUN_NUMBER" --release-url "$RELEASE_URL" --worker-assets

      - name: Upload native packages
        if: inputs.profile == 'package'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.profile }}-${{ matrix.id }}
          path: ${{ steps.native.outputs.package-directory }}
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure() && steps.native.outputs.build-directory != ''
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.profile }}-${{ matrix.id }}
          path: |
            ${{ steps.native.outputs.build-directory }}/vcpkg-manifest-install.log
            ${{ steps.native.outputs.build-directory }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Retain test results
        if: inputs.profile == 'check' && matrix.check.retain_test_log
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.id }}
          path: ${{ steps.native.outputs.build-directory }}/Testing/Temporary/LastTest.log
